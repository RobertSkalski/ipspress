<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IPSPRESS | Agencja Fotografii</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <nav class="nav-links">
    <a href="#">Zdjęcia</a>
    <a href="#">Wideo</a>
    <a href="#">Kategorie</a>
    <a href="#">O nas</a>
    <a href="#">Kontakt</a>
  </nav>

  <div class="logo">IPSPRESS</div>

  <div class="header-actions">
    <div class="lang-dropdown">
      <button class="lang-btn">Polski <span>▼</span></button>
      <div class="lang-menu">
        <a href="#">Polski</a>
        <a href="#">English</a>
        <a href="#">Español</a>
        <a href="#">Français</a>
      </div>
    </div>
    <button class="btn-login" id="loginBtn" onclick="toggleLogin()">Zaloguj się</button>
  </div>
</header>

<section class="welcome-section">
  <div class="typing-container">
    <h1 class="typing-main">Cześć!</h1>
    <h2 class="typing-sub">Dobrze Cię widzieć!</h2>
  </div>
  
  <div class="search-wrapper">
    <div class="search-container">
      <input type="text" id="searchInput" placeholder="Szukaj obrazów">
      <button class="search-btn" onclick="handleSearch()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
      </button>
    </div>
    <div id="searchMessage" class="search-message">Musisz się zalogować, aby wyszukiwać!</div>
  </div>
</section>

<div class="gallery">
  <div class="gallery-item"><img src="foto/glowna/main1.jpg" alt="Zdjęcie sportowe 1"></div>
  <div class="gallery-item"><img src="foto/glowna/main2.jpg" alt="Zdjęcie sportowe 2"></div>
  <div class="gallery-item"><img src="foto/glowna/main3.jpg" alt="Zdjęcie sportowe 3"></div>
  <div class="gallery-item"><img src="foto/glowna/main1.jpg" alt="Zdjęcie sportowe 4"></div>
  <div class="gallery-item"><img src="foto/glowna/main2.jpg" alt="Zdjęcie sportowe 5"></div>
  <div class="gallery-item"><img src="foto/glowna/main3.jpg" alt="Zdjęcie sportowe 6"></div>
</div>

<footer>
  <div class="footer-socials">
    <a href="https://x.com/Skalski_Robert" target="_blank"><img src="elementy_graf/x.png" alt="X" class="icon-img"></a>
    <a href="https://www.facebook.com/RobertSkalskiPhotography" target="_blank"><img src="elementy_graf/fb.png" alt="FB" class="icon-img"></a>
    <a href="https://www.instagram.com/robertskalski_photography/" target="_blank"><img src="elementy_graf/ig.png" alt="IG" class="icon-img"></a>
    <a href="mailto:robertskalski20@gmail.com"><img src="elementy_graf/mail.png" alt="Email" class="icon-img"></a>
  </div>
  <p class="copyright-text">Wszystkie fotografie stanowią własność autora. Kopiowanie i rozpowszechnianie bez jego zgody jest zabronione.</p>
</footer>

<script>
  // Zabezpieczenie przed pobieraniem zdjęć
  document.querySelectorAll('.gallery-item img').forEach(img => {
    img.addEventListener('contextmenu', function(e) { e.preventDefault(); });
    img.addEventListener('dragstart', function(e) { e.preventDefault(); });
  });

  // LOGIKA WYSZUKIWARKI I LOGOWANIA
  let isLoggedIn = false; // Zmienna pamiętająca stan logowania

  function toggleLogin() {
    const btn = document.getElementById('loginBtn');
    
    if (!isLoggedIn) {
      // Symulacja zalogowania
      isLoggedIn = true;
      btn.innerText = "Wyloguj się";
      btn.style.background = "#4CAF50"; // Zmiana koloru na zielony po zalogowaniu
      btn.style.color = "white";
      document.getElementById('searchMessage').style.display = "none"; // Ukrywa błąd, jeśli wisiał
      alert("Zalogowano pomyślnie! Wyszukiwarka została odblokowana.");
    } else {
      // Symulacja wylogowania
      isLoggedIn = false;
      btn.innerText = "Zaloguj się";
      btn.style.background = "white";
      btn.style.color = "black";
      alert("Wylogowano.");
    }
  }

  function handleSearch() {
    const msg = document.getElementById('searchMessage');
    const input = document.getElementById('searchInput').value;
    
    if (!isLoggedIn) {
      // Błąd: Brak logowania
      msg.innerText = "Musisz się zalogować, aby wyszukiwać materiały!";
      msg.style.color = "#ff4444";
      msg.style.display = "block";
      
      // Ukrywa komunikat po 3 sekundach
      setTimeout(() => { msg.style.display = "none"; }, 3000);
    } else if (input.trim() === "") {
      // Błąd: Puste pole (ale zalogowany)
      msg.innerText = "Wpisz frazę do wyszukania!";
      msg.style.color = "#ffcc00"; // Żółty kolor dla ostrzeżenia
      msg.style.display = "block";
      
      setTimeout(() => { msg.style.display = "none"; }, 3000);
    } else {
      // Sukces: Zalogowany i coś wpisał
      alert("Szukam wyników dla frazy: " + input + "\n\n(Tu w przyszłości wyświetlą się zdjęcia)");
    }
  }
</script>

</body>
</html>
