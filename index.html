  <!-- Dodajemy nowoczesną czcionkę Montserrat z Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
  /* RESET I PODSTAWY */
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    background-image: url('foto/glowna/tlo1.jpg'); 
    background-attachment: fixed; 
    background-size: cover;      
    background-position: center;  
    background-repeat: no-repeat; 
    background-color: #000;
    color: white;
    font-family: 'Montserrat', sans-serif;
  }

  /* NAGŁÓWEK */
  header {
    position: fixed;
    top: 0;
    width: 100%;
    padding: 20px 40px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: rgba(10, 10, 10, 0.85);
    backdrop-filter: blur(10px);
    z-index: 1000;
    border-bottom: 1px solid rgba(255,255,255,0.05);
  }








    .welcome-section {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 190px;
      padding-top: 100px;
      text-align: center;
    }

.typing-container {
      display: inline-block;
    }

/* Duży napis "Hello!" */
.typing-main {
      font-size: 64px;
      font-weight: 700;
      margin-bottom: 10px;
      overflow: hidden;
      white-space: nowrap;
      border-right: 3px solid transparent; /* Startujemy z ukrytym kursorem */
      width: 0;
      /* Kursor mruga tylko przez 1.2s, potem znika */
      animation: 
        typing 1s steps(10, end) forwards,
        blink-caret-main 1.2s step-end;
    }

/* Mniejszy napis pod spodem */
.typing-sub {
  font-size: 24px;
  font-weight: 400;
  color: #ccc;
  overflow: hidden;
  white-space: nowrap;
  border-right: 3px solid transparent;
  width: 0;
  margin: 0 auto;
  /* Startuje po 1.2s, kursor mruga przez 2s i znika */
  animation: 
    typing 2s steps(25, end) 1.2s forwards,
    blink-caret-sub 2s step-end 1.2s;
}

/* Animacja pisania */
@keyframes typing {
  from { width: 0 }
  to { width: 100% }
}

/* Kursor dla pierwszej linii - mruga i na końcu zostaje przezroczysty */
@keyframes blink-caret-main {
  from, to { border-color: transparent }
  50% { border-color: #ffffff; }
  100% { border-color: transparent; }
}

/* Kursor dla drugiej linii - mruga i na końcu zostaje przezroczysty */
@keyframes blink-caret-sub {
  from, to { border-color: transparent }
  50% { border-color: #ffffff; }
  100% { border-color: transparent; }
}

@media (max-width: 768px) {
  .typing-main { font-size: 40px; }
  .typing-sub { font-size: 18px; }
  .welcome-section { height: 300px; }
}



    
    
    
  .nav-links { display: flex; gap: 20px; }
  .nav-links a {
    color: white;
    text-decoration: none;
    font-size: 14px;
    font-weight: 600;
    transition: 0.3s;
  }
  .nav-links a:hover { color: #aaaaaa; }

  .logo {
    font-size: 24px;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
  }

  .social-icons { display: flex; gap: 15px; align-items: center; }
  .icon-img { width: 24px; height: 24px; object-fit: contain; transition: 0.3s; }
  .icon-img:hover { opacity: 0.7; }

  /* GALERIA - POPRAWIONA I WYCENTROWANA */
  .gallery {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 15px;
    padding: 250px 40px 40px; /* 140px góry, żeby nie chowało się pod menu */
    max-width: 1400px;
    margin: 0 auto;
  }

  .gallery-item {
    width: 100%;
    aspect-ratio: 3 / 2;
    overflow: hidden;
    border-radius: 6px;
    background: #111;
  }

  .gallery-item img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    transition: transform 0.5s ease;
    display: block;
  }

  .gallery-item:hover img {
    transform: scale(1.1);
    filter: brightness(1.1);
  }

  /* STOPKA - TU SĄ KLUCZOWE ZMIANY */
  footer {
    width: 100%;
    padding: 40px 20px 60px; /* Trzecia wartość (80px) to wolne miejsce na dole */
    text-align: center;      /* Środkuje tekst o prawach autorskich */
    background: rgba(0, 0, 0, 0.7); 
    margin-top: 20px;
  }

  .footer-socials {
    display: flex;
    justify-content: center; /* Środkuje ikony poziomo */
    gap: 10px;
    margin-bottom: 10px;
  }

  .copyright-text {
    font-size: 12px;
    color: #bbb;
    max-width: 800px;
    margin: 0 auto; /* Gwarantuje, że blok tekstu jest na środku */
    line-height: 1.6;
    letter-spacing: 0.5px;
  }

  @media(max-width: 900px) {
    .gallery { grid-template-columns: repeat(2, 1fr); }
  }
  @media(max-width: 600px) {
    .gallery { grid-template-columns: 1fr; padding-top: 100px; }
    .nav-links, .social-icons { display: none; }
  }
</style>
</head>
