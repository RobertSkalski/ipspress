<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IPSPRESS</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    body{
      background:#000;
      color:white;
      font-family:Arial, sans-serif;
    }

    header{
      position:fixed;
      top:0;
      width:100%;
      padding:25px 40px;
      display:flex;
      justify-content:space-between;
      align-items:center;
      background:rgba(0,0,0,0.7);
      backdrop-filter:blur(10px);
      z-index:1000;
    }

    .logo{
      font-size:20px;
      font-weight:bold;
      letter-spacing:3px;
    }

    .gallery{
      column-count:3;
      column-gap:12px;
      padding:120px 12px 12px;
    }

    .gallery img{
      width:100%;
      margin-bottom:12px;
      border-radius:10px;
      display:block;
      transition:0.3s;
    }

    .gallery img:hover{
      opacity:0.85;
      transform:scale(0.995);
    }

    @media(max-width:900px){
      .gallery{
        column-count:2;
      }
    }

    @media(max-width:600px){
      .gallery{
        column-count:1;
      }

      header{
        padding:20px;
      }
    }
  </style>
</head>

<body>

<header>
  <div class="logo">IPSPRESS</div>
</header>

<div class="gallery">

  <img src="https://images.unsplash.com/photo-1547347298-4074fc3086f0?q=80&w=1200">
  
  <img src="https://images.unsplash.com/photo-1517649763962-0c623066013b?q=80&w=1200">

  <img src="https://images.unsplash.com/photo-1508098682722-e99c43a406b2?q=80&w=1200">

  <img src="https://images.unsplash.com/photo-1511886929837-354d827aae26?q=80&w=1200">

  <img src="https://images.unsplash.com/photo-1574629810360-7efbbe195018?q=80&w=1200">

  <img src="https://images.unsplash.com/photo-1517466787929-bc90951d0974?q=80&w=1200">

</div>

</body>
</html>
