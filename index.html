<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IPSPRESS - Agencja Fotografii Sportowej</title>

  <!-- Dodajemy nowoczesną czcionkę Montserrat z Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    /* RESET: Usuwamy domyślne marginesy przeglądarki */
    *{
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body{
      /* Ciemne tło, tak jak w projekcie Adobe */
      background: #0a0a0a; 
      color: white;
      /* Zmieniamy czcionkę na nowszą */
      font-family: 'Montserrat', sans-serif; 
    }

    /* --- STYLIZACJA NAGŁÓWKA (MENU) --- */
    header {
      position: fixed;
      top: 0;
      width: 100%;
      padding: 20px 40px;
      /* Flexbox pozwala nam ułożyć 3 sekcje (lewa, środek, prawa) obok siebie */
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(10, 10, 10, 0.85); /* Ciemniejsze, lekko przezroczyste tło */
      backdrop-filter: blur(10px);
      z-index: 1000;
      border-bottom: 1px solid rgba(255,255,255,0.05); /* Delikatna linia oddzielająca */
    }

    /* Lewa strona: Linki do podstron */
    .nav-links {
      display: flex;
      gap: 20px; /* Odstęp między linkami */
    }

    .nav-links a {
      color: white;
      text-decoration: none;
      font-size: 14px;
      font-weight: 600;
      transition: color 0.3s ease;
    }

    .nav-links a:hover {
      color: #aaaaaa; /* Kolor po najechaniu myszką */
    }

    /* Środek: Logo */
    .logo {
      font-size: 24px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    /* Prawa strona: Ikony (na razie jako tekst, później podmienimy na ikonki SVG) */
    .social-icons {
      display: flex;
      gap: 15px; /* Odstęp między ikonami */
      align-items: center;
    }
    
    .icon-img {
      width: 24px;  /* Stała szerokość ikony */
      height: 24px; /* Stała wysokość ikony */
      object-fit: contain; /* Gwarantuje, że logo nie zostanie rozciągnięte */
      transition: opacity 0.3s ease;
    }
    
    .icon-img:hover {
      opacity: 0.7; /* Lekkie zblednięcie po najechaniu */
    }

    /* --- STYLIZACJA GALERII --- */
    .gallery {
      column-count: 3;
      column-gap: 15px;
      padding: 120px 40px 40px; /* Zwiększony padding po bokach */
      max-width: 1400px; /* Ograniczamy szerokość galerii na wielkich ekranach */
      margin: 0 auto; /* Środkujemy galerię */
    }

    .gallery img {
      width: 100%;
      margin-bottom: 15px;
      border-radius: 6px; /* Zmniejszyłem zaokrąglenie dla bardziej "agresywnego", sportowego wyglądu */
      display: block;
      transition: 0.3s;
    }

    .gallery img:hover {
      opacity: 0.8;
      transform: scale(0.98);
    }

    /* Responsywność dla mniejszych ekranów */
    @media(max-width: 900px){
      .gallery { column-count: 2; padding: 100px 20px 20px; }
      header { padding: 15px 20px; }
      .nav-links, .social-icons { display: none; } /* Na telefonach ukrywamy menu - zrobimy tu "hamburgera" później */
    }

    @media(max-width: 600px){
      .gallery { column-count: 1; }

      .gallery {
    display: grid;
    /* Tworzy 3 równe kolumny */
    grid-template-columns: repeat(3, 1fr); 
    gap: 15px;
    padding: 120px 40px 40px;
    max-width: 1400px;
    margin: 0 auto;
  }

  .gallery-item {
    width: 100%;
    /* Wymusza proporcje 3:2 (typowe dla fotografii sportowej) */
    aspect-ratio: 3 / 2; 
    overflow: hidden;
    border-radius: 6px;
  }

  .gallery-item img {
    width: 100%;
    height: 100%;
    /* Kluczowy element: zdjęcie wypełnia kadr bez zniekształceń */
    object-fit: cover; 
    transition: transform 0.5s ease;
    display: block;
  }

  .gallery-item:hover img {
    transform: scale(1.1); /* Efekt przybliżenia przy najechaniu */
  }

  /* Responsywność */
  @media(max-width: 900px) {
    .gallery { grid-template-columns: repeat(2, 1fr); }
  }
  @media(max-width: 600px) {
    .gallery { grid-template-columns: 1fr; }
  }

  footer {
  padding: 60px 20px;
  text-align: center; /* Środkuje wszystko wewnątrz stopki */
  background: #0a0a0a;
  border-top: 1px solid rgba(255, 255, 255, 0.05); /* Delikatna kreska oddzielająca */
  margin-top: 40px;
}

.footer-socials {
  display: flex;
  justify-content: center; /* Środkuje ikony w poziomie */
  gap: 20px;
  margin-bottom: 20px;
}

.copyright-text {
  font-size: 12px;
  color: #666; /* Szary kolor tekstu, aby nie odciągał uwagi od zdjęć */
  max-width: 600px;
  margin: 0 auto;
  line-height: 1.6;
  letter-spacing: 0.5px;
}
      
</style>
    }
  </style>
</head>
<body>

  <div class="footer-socials">

</body>
</html>
