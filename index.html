<head>

  <!-- Dodajemy nowoczesną czcionkę Montserrat z Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
  /* RESET I PODSTAWY */
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    background-image: url('foto/glowna/tlo1.jpg'); 
    background-attachment: fixed; 
    background-size: cover;      
    background-position: center;  
    background-repeat: no-repeat; 
    background-color: #000;
    color: white;
    font-family: 'Montserrat', sans-serif;
  }

  /* NAGŁÓWEK */
  header {
    position: fixed;
    top: 0;
    width: 100%;
    padding: 20px 40px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: rgba(10, 10, 10, 0.85);
    backdrop-filter: blur(10px);
    z-index: 1000;
    border-bottom: 1px solid rgba(255,255,255,0.05);
  }



     .login-container {
  display: flex;
  flex-direction: column;
  align-items: flex-end; /* Wyrównuje do prawej strony menu */
}

.login-fields {
  display: flex;
  gap: 8px;
}

.login-error {
  color: #ff4444;
  font-size: 10px;
  margin-top: 4px;
  display: none; /* Ukryte domyślnie */
  font-weight: 600;
  text-transform: uppercase;
}

/* Reszta stylów .nav-input i .nav-login-btn zostaje bez zmian z poprzedniego kroku */


    
.nav-input {
  background: rgba(255, 255, 255, 0.1); /* Półprzezroczyste tło */
  border: 1px solid rgba(255, 255, 255, 0.2);
  color: white;
  padding: 4px 10px;
  border-radius: 4px;
  font-size: 11px;
  font-family: 'Montserrat', sans-serif;
  width: 90px; /* Mała szerokość, żeby nie zdominowało menu */
  transition: all 0.3s ease;
}

.nav-input:focus {
  outline: none;
  border-color: #fff;
  background: rgba(255, 255, 255, 0.2);
}

.nav-login-btn {
  background: white;
  color: black;
  border: none;
  padding: 4px 12px;
  border-radius: 4px;
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  cursor: pointer;
  font-family: 'Montserrat', sans-serif;
  transition: opacity 0.3s ease;
}

.nav-login-btn:hover {
  opacity: 0.8;
}

/* Ukrywamy panel na bardzo małych telefonach, żeby menu się nie rozjechało */
@media (max-width: 480px) {
  .login-container {
    display: none;
  }
}




    .welcome-section {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 300px;
      padding-top: 150px;
      text-align: center;
    }

.typing-container {
      display: inline-block;
    }

/* Duży napis "Hello!" */
.typing-main {
      font-size: 80px;
      font-weight: 700;
      margin-bottom: 10px;
      overflow: hidden;
      white-space: nowrap;
      border-right: 3px solid transparent; /* Startujemy z ukrytym kursorem */
      width: 0;
      /* Kursor mruga tylko przez 1.2s, potem znika */
      animation: 
        typing 1s steps(10, end) forwards,
        blink-caret-main 1.2s step-end;
    }

/* Mniejszy napis pod spodem */
.typing-sub {
  font-size: 48px;
  font-weight: 400;
  color: #ccc;
  overflow: hidden;
  white-space: nowrap;
  border-right: 3px solid transparent;
  width: 0;
  margin: 0 auto;
  /* Startuje po 1.2s, kursor mruga przez 2s i znika */
  animation: 
    typing 2s steps(25, end) 1.2s forwards,
    blink-caret-sub 2s step-end 1.2s;
}

/* Animacja pisania */
@keyframes typing {
  from { width: 0 }
  to { width: 100% }
}

/* Kursor dla pierwszej linii - mruga i na końcu zostaje przezroczysty */
@keyframes blink-caret-main {
  from, to { border-color: transparent }
  50% { border-color: #ffffff; }
  100% { border-color: transparent; }
}

/* Kursor dla drugiej linii - mruga i na końcu zostaje przezroczysty */
@keyframes blink-caret-sub {
  from, to { border-color: transparent }
  50% { border-color: #ffffff; }
  100% { border-color: transparent; }
}

@media (max-width: 768px) {
  .typing-main { font-size: 40px; }
  .typing-sub { font-size: 18px; }
  .welcome-section { height: 300px; }
}



    
    
    
  .nav-links { display: flex; gap: 20px; }
  .nav-links a {
    color: white;
    text-decoration: none;
    font-size: 14px;
    font-weight: 600;
    transition: 0.3s;

  .logo {

    text-transform: uppercase;
  }

  .social-icons { display: flex; gap: 15px; align-items: center; }
  .icon-img { width: 24px; height: 24px; object-fit: contain; transition: 0.3s; }
  .icon-img:hover { opacity: 0.7; }

  /* GALERIA - POPRAWIONA I WYCENTROWANA */
  .gallery {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 15px;
    padding: 130px 40px 40px; /* 140px góry, żeby nie chowało się pod menu */
    max-width: 1400px;
    margin: 0 auto;
  }

  .gallery-item {
    width: 100%;
    aspect-ratio: 3 / 2;
    overflow: hidden;
    border-radius: 6px;
    background: #111;
  }

  .gallery-item img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    transition: transform 0.5s ease;
    display: block;
    /* Uniemożliwia przeciąganie zdjęcia myszką */
    -webkit-user-drag: none;
    -khtml-user-drag: none;
    -moz-user-drag: none;
    -o-user-drag: none;
    
    /* Sprawia, że zdjęcie jest ignorowane przez kliknięcia myszy */
    /* UWAGA: to może wyłączyć efekt hover (powiększanie), 
       jeśli nie ustawimy tego na odpowiednim poziomie kaskady. */
    pointer-events: none; 
    
    /* Blokuje zaznaczanie */
  user-select: none;
  }

  .gallery-item:hover img {
    transform: scale(1.1);
    filter: brightness(1.1);
  }

  /* STOPKA - TU SĄ KLUCZOWE ZMIANY */
  footer {
    width: 100%;
    padding: 40px 20px 60px; /* Trzecia wartość (80px) to wolne miejsce na dole */
    text-align: center;      /* Środkuje tekst o prawach autorskich */
    background: rgba(0, 0, 0, 0.7); 
    margin-top: 20px;
  }

  .footer-socials {
    display: flex;
    justify-content: center; /* Środkuje ikony poziomo */
    gap: 10px;
    margin-bottom: 10px;
  }

  .copyright-text {
    font-size: 12px;
    color: #bbb;
    max-width: 800px;
    margin: 0 auto; /* Gwarantuje, że blok tekstu jest na środku */
    line-height: 1.6;
    letter-spacing: 0.5px;
  }

  @media(max-width: 900px) {
    .gallery { grid-template-columns: repeat(2, 1fr); }
  }
  @media(max-width: 600px) {
    .gallery { grid-template-columns: 1fr; padding-top: 100px; }
    .nav-links, .social-icons { display: none; }
  }
</style>

  <script>
  function checkLogin() {
    // Pobieramy wartości z pól
    const login = document.getElementById('userLogin').value;
    const pass = document.getElementById('userPass').value;
    const error = document.getElementById('errorMsg');

    // Ustalamy "prawidłowe" dane dla testu
    const validLogin = "admin";
    const validPass = "sport123";

    if (login === validLogin && pass === validPass) {
      alert("Success! (W przyszłości tu nastąpi przekierowanie)");
      error.style.display = "none";
    } else {
      // Jeśli dane są złe, pokazujemy czerwony napis
      error.style.display = "block";
      
      // Opcjonalnie: ukryj błąd po 3 sekundach
      setTimeout(() => {
        error.style.display = "none";
      }, 3000);
    }
  }
</script>
