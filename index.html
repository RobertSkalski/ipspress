<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IPSPRESS | Agencja Fotografii</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    /* =========================================
       1. RESET I PODSTAWY
       ========================================= */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-image: url('foto/glowna/tlo1.jpg'); 
      background-attachment: fixed; 
      background-size: cover;      
      background-position: center;  
      background-repeat: no-repeat; 
      background-color: #000;
      color: white;
      font-family: 'Montserrat', sans-serif;
      /* overflow-x: hidden zapobiega poziomemu paskowi przewijania */
      overflow-x: hidden; 
    }

    /* =========================================
       2. NAGŁÓWEK (HEADER)
       ========================================= */
    header {
      position: fixed;
      top: 0;
      width: 100%;
      padding: 20px 40px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(10, 10, 10, 0.95); /* Mocniejsze tło, by tekst był czytelny */
      backdrop-filter: blur(10px);
      z-index: 1000;
      border-bottom: 1px solid rgba(255,255,255,0.05);
    }

    /* Lewa strona: Nawigacja */
    .nav-links {
      display: flex;
      gap: 25px;
      z-index: 10; /* Musi być nad logo */
    }

    .nav-links a {
      color: white;
      text-decoration: none;
      font-size: 14px;
      font-weight: 500;
      transition: color 0.3s ease;
    }

    .nav-links a:hover {
      color: #aaaaaa;
    }

    /* Środek: Logo (Zawsze na środku ekranu) */
    .logo {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      font-size: 24px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      pointer-events: none; /* Kliknięcia "przelatują" przez logo, by nie blokować menu */
    }

    /* Prawa strona: Akcje (Język + Logowanie) */
    .header-actions {
      display: flex;
      align-items: center;
      gap: 20px;
      z-index: 10;
    }

    /* Dropdown wyboru języka */
    .lang-dropdown {
      position: relative;
      display: inline-block;
    }

    .lang-btn {
      background: transparent;
      color: white;
      border: none;
      font-family: 'Montserrat', sans-serif;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 10px 0;
    }

    /* Strzałka w dół */
    .lang-btn span {
      font-size: 10px;
      transition: transform 0.3s ease;
    }

    .lang-dropdown:hover .lang-btn span {
      transform: rotate(180deg); /* Obraca strzałkę po najechaniu */
    }

    /* Rozwijane menu języków */
    .lang-menu {
      display: none;
      position: absolute;
      top: 100%;
      right: 0;
      background: #1a1a1a;
      min-width: 140px;
      border-radius: 6px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0,0,0,0.7);
      border: 1px solid rgba(255,255,255,0.1);
    }

    .lang-dropdown:hover .lang-menu {
      display: block;
    }

    .lang-menu a {
      display: block;
      color: white;
      text-decoration: none;
      padding: 12px 20px;
      font-size: 13px;
      font-weight: 500;
      transition: background 0.3s ease;
    }

    .lang-menu a:hover {
      background: rgba(255,255,255,0.1);
    }

    /* Przycisk logowania */
    .btn-login {
      background: white;
      color: black;
      border: none;
      padding: 10px 24px;
      border-radius: 6px; /* Lekko zaokrąglone rogi jak na Shutterstock */
      font-family: 'Montserrat', sans-serif;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.3s ease, transform 0.1s ease;
    }

    .btn-login:hover {
      background: #e0e0e0;
    }

    .btn-login:active {
      transform: scale(0.95); /* Efekt wciśnięcia guzika */
    }

    /* =========================================
       3. SEKCJA POWITALNA
       ========================================= */
    .welcome-section {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 350px;
      padding-top: 120px;
      text-align: center;
    }

    .typing-container { display: inline-block; }

    .typing-main {
      font-size: 80px;
      font-weight: 700;
      margin-bottom: 10px;
      overflow: hidden;
      white-space: nowrap;
      border-right: 3px solid transparent;
      width: 0;
      animation: typing 1s steps(10, end) forwards, blink-caret-main 1.2s step-end;
    }

    .typing-sub {
      font-size: 48px;
      font-weight: 400;
      color: #ccc;
      overflow: hidden;
      white-space: nowrap;
      border-right: 3px solid transparent;
      width: 0;
      margin: 0 auto;
      animation: typing 2s steps(25, end) 1.2s forwards, blink-caret-sub 2s step-end 1.2s;
    }

    @keyframes typing { from { width: 0 } to { width: 100% } }
    @keyframes blink-caret-main { 50% { border-color: #ffffff; } 100% { border-color: transparent; } }
    @keyframes blink-caret-sub { 50% { border-color: #ffffff; } 100% { border-color: transparent; } }

    /* =========================================
       4. GALERIA
       ========================================= */
    .gallery {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 15px;
      padding: 60px 40px 80px;
      max-width: 1400px;
      margin: 0 auto;
    }

    .gallery-item {
      width: 100%;
      aspect-ratio: 3 / 2;
      overflow: hidden;
      border-radius: 6px;
      background: #111;
      cursor: pointer;
    }

    .gallery-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.6s ease, filter 0.6s ease;
      display: block;
      /* Blokada przeciągania na poziomie CSS */
      -webkit-user-drag: none;
      user-select: none;
    }

    .gallery-item:hover img {
      transform: scale(1.08);
      filter: brightness(0.8); /* Lekkie ściemnienie, by dodać głębi */
    }

    /* =========================================
       5. STOPKA
       ========================================= */
    footer {
      width: 100%;
      padding: 60px 20px 40px;
      text-align: center;
      background: rgba(0, 0, 0, 0.9);
      border-top: 1px solid rgba(255,255,255,0.05);
    }

    .footer-socials {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-bottom: 20px;
    }

    .icon-img {
      width: 24px;
      height: 24px;
      object-fit: contain;
      transition: opacity 0.3s ease, transform 0.3s ease;
    }

    .icon-img:hover {
      opacity: 0.7;
      transform: translateY(-3px); /* Ikony lekko podskakują przy najechaniu */
    }

    .copyright-text {
      font-size: 12px;
      color: #777;
      max-width: 800px;
      margin: 0 auto;
      line-height: 1.6;
    }

    /* =========================================
       6. RESPONSYWNOŚĆ (TELEFONY I TABLETY)
       ========================================= */
    @media(max-width: 900px) {
      .gallery { grid-template-columns: repeat(2, 1fr); }
      .typing-main { font-size: 50px; }
      .typing-sub { font-size: 30px; }
    }
    
    @media(max-width: 768px) {
      header { padding: 15px 20px; }
      /* Ukrywamy pełne menu na telefonach - tu kiedyś zrobimy "hamburgera" */
      .nav-links, .lang-dropdown { display: none; }
      .logo { position: static; transform: none; margin-right: auto; }
      .welcome-section { height: 250px; }
      .gallery { grid-template-columns: 1fr; padding: 20px; }
    }
  </style>
</head>
<body>

<header>
  <nav class="nav-links">
    <a href="#">Zdjęcia</a>
    <a href="#">Wideo</a>
    <a href="#">Kategorie</a>
    <a href="#">O nas</a>
    <a href="#">Kontakt</a>
  </nav>

  <div class="logo">IPSPRESS</div>

  <div class="header-actions">
    
    <div class="lang-dropdown">
      <button class="lang-btn">Polski <span>▼</span></button>
      <div class="lang-menu">
        <a href="#">Polski</a>
        <a href="#">English</a>
        <a href="#">Español</a>
        <a href="#">Français</a>
      </div>
    </div>

    <button class="btn-login" onclick="openLoginModal()">Zaloguj się</button>
  </div>
</header>

<section class="welcome-section">
  <div class="typing-container">
    <h1 class="typing-main">Cześć!</h1>
    <h2 class="typing-sub">Dobrze Cię widzieć!</h2>
  </div>
</section>

<div class="gallery">
  <div class="gallery-item"><img src="foto/glowna/main1.jpg" alt="Zdjęcie sportowe 1"></div>
  <div class="gallery-item"><img src="foto/glowna/main2.jpg" alt="Zdjęcie sportowe 2"></div>
  <div class="gallery-item"><img src="foto/glowna/main3.jpg" alt="Zdjęcie sportowe 3"></div>
  <div class="gallery-item"><img src="foto/glowna/main1.jpg" alt="Zdjęcie sportowe 4"></div>
  <div class="gallery-item"><img src="foto/glowna/main2.jpg" alt="Zdjęcie sportowe 5"></div>
  <div class="gallery-item"><img src="foto/glowna/main3.jpg" alt="Zdjęcie sportowe 6"></div>
</div>

<footer>
  <div class="footer-socials">
    <a href="https://x.com/Skalski_Robert" target="_blank"><img src="elementy_graf/x.png" alt="X" class="icon-img"></a>
    <a href="https://www.facebook.com/RobertSkalskiPhotography" target="_blank"><img src="elementy_graf/fb.png" alt="FB" class="icon-img"></a>
    <a href="https://www.instagram.com/robertskalski_photography/" target="_blank"><img src="elementy_graf/ig.png" alt="IG" class="icon-img"></a>
    <a href="mailto:robertskalski20@gmail.com"><img src="elementy_graf/mail.png" alt="Email" class="icon-img"></a>
  </div>
  <p class="copyright-text">Wszystkie fotografie stanowią własność autora. Kopiowanie i rozpowszechnianie bez jego zgody jest zabronione.</p>
</footer>

<script>
  // Zabezpieczenie przed pobieraniem zdjęć (prawy klik)
  document.querySelectorAll('.gallery-item img').forEach(img => {
    img.addEventListener('contextmenu', function(e) { e.preventDefault(); });
    img.addEventListener('dragstart', function(e) { e.preventDefault(); });
  });

  // Funkcja przypisana do nowego przycisku "Zaloguj się"
  function openLoginModal() {
    alert("W przyszłości otworzy się tutaj piękny popup do logowania!");
  }
</script>

</body>
</html>
